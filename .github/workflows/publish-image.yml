name: Publish frontend image

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/publish-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          load: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://abaiairport.kz/api' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container serves the website
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT: ${{ github.sha }}
        run: |
          trap 'docker logs frontend-smoke; docker rm -f frontend-smoke' EXIT
          docker run --detach --name frontend-smoke \
            --publish 127.0.0.1:3000:3000 "$IMAGE:$COMMIT"
          curl --fail --silent --show-error --retry 12 --retry-delay 2 \
            --retry-connrefused --max-time 10 \
            http://127.0.0.1:3000/ --output /tmp/frontend.html
          grep -q '<html' /tmp/frontend.html
          asset=$(grep -oE '/_next/static/[^" ]+\.css' /tmp/frontend.html | head -n 1)
          test -n "$asset"
          curl --fail --silent --show-error --max-time 10 \
            "http://127.0.0.1:3000$asset" --output /dev/null

      - name: Publish verified image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT: ${{ github.sha }}
        run: |
          docker push "$IMAGE:$COMMIT"
          docker push "$IMAGE:latest"
          {
            echo "Published: $IMAGE:latest"
            echo "Commit tag: $IMAGE:$COMMIT"
            echo "Dokploy: Docker provider, image $IMAGE:latest, application port 3000."
          } >> "$GITHUB_STEP_SUMMARY"
